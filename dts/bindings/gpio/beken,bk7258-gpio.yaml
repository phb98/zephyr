title: Beken BK7258 GPIO port

description: gpio0 is pads 0 to 31, gpio1 is pads 32 to 55.

compatible: "beken,bk7258-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true

  interrupts:
    required: true

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
